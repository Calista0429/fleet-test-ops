services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: fleet_ops
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: local_fleet_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fleet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_ops"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  fleet_data:
