dth="170" height="60" rx="6" fill="#0f172a"/><rect x="750" y="510" width="170" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="835" y="534" fill="white" font-size="12" font-weight="600" text-anchor="middle">GitHub Actions</text><text x="835" y="554" fill="#94a3b8" font-size="9" text-anchor="middle">Types · lint · tests · build</text></g><text x="220" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">UI</text>
<text x="475" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">JSON</text>
