<path d="M 835 200 V 248" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
<path d="M 440 540 H 508" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<path d="M 680 540 H 748" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<!-- Runtime and development boundaries do not imply a cloud provider. -->
<rect x="230" y="100" width="720" height="310" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
<text x="248" y="122" fill="#cbd5e1" font-size="10" font-weight="600">APPLICATION · LOCAL DEVELOPMENT / SAME-ORIGIN BUILD</text>
