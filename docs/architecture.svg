<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="architecture-title architecture-description" style="font-family:'JetBrains Mono',monospace">
<title id="architecture-title">Fleet Test Operations planned architecture</title>
<desc id="architecture-description">A test coordinator uses a React and TypeScript web app. The web app calls an Express API, which queries PostgreSQL. Shared validation contracts and migrations support these components. A separate development workflow uses GitHub Issues, pull requests, and automated checks.</desc>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
</defs>
<rect width="1000" height="700" rx="12" fill="#020617"/>
<rect width="1000" height="700" fill="url(#grid)"/>
<text x="40" y="40" fill="white" font-size="16" font-weight="700">Fleet Test Operations</text>
<text x="40" y="61" fill="#94a3b8" font-size="9">Planned MVP · React + TypeScript · Express · PostgreSQL</text>
<!-- Connections precede all opaque component backgrounds. -->
<path d="M 180 295 H 258" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<path d="M 440 295 H 508" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<path d="M 680 295 H 748" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
